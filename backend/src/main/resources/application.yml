debug: false

spring:
  application:
    name: gym-duong-double-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gym_duong_double}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  flyway:
    enabled: false
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-change-this-secret-at-least-32-characters}
      access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:120}
  seed:
    owner:
      email: ${OWNER_EMAIL:owner@gymduongdouble.local}
      password: ${OWNER_PASSWORD:ChangeMe@2026}
      full-name: ${OWNER_FULL_NAME:Đoàn Thế Tín}
      phone: ${OWNER_PHONE:0965193907}
    demo:
      enabled: ${DEMO_SEED_ENABLED:true}
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:5174
      - http://localhost:3000

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN
